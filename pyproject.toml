[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-server"
version = "0.1.0"
description = "Authenticated MCP context server"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.7,<1",
    "fastmcp==3.4.11",
    "platformdirs>=4,<5",
    "sqlite-vec>=0.1.6,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[project.scripts]
context-server = "context_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
